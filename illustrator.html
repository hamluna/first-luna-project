<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>일러스트레이터</title>
        <link rel="stylesheet" href="css/style_illustator.css">
        <link rel="stylesheet" href="css/style_header.css">
    

        
    </head>
        
    <body>
        <div id="wrap">
            <!--헤더 고정-->
           <div id="header">
                <script>
                    fetch('header.html')
                    .then(res => res.text())
                    .then(data => {
                    document.getElementById('header').innerHTML = data;
                    });
                </script>
            </div>
            
            <!--맨 위로 버튼-->
            <button id="topBtn" title="맨 위로">
            TOP
            </button>



            <article id="slider">

                
                <div class="image-box">
                    <div class="image-box1">
                        <p>│ 이모티콘</p>
                    </div>   
                        <br>
                    <div class="image-box2">
                        <p>치즈 고양이</p>
                    </div> 
                        <br>
                        <br>
                    <img src="images/emoticon01.png" alt="1">
                        <br>


                    <div class="image-box1">
                        <p>│ 캐리커쳐</p>
                    </div>   
                        <br>
                    <div class="image-box2">
                        <p>예능 "비정상 회담"</p>
                    </div> 
                        <br>
                        <br>
                    <img src="images/takuya1.jpg" alt="2">
                        <br>
                        <br>
                        <br>
                    <img src="images/sam1.jpg" alt="3">
                        <br>
                        
                </div>
                

 
            </article>
        </div>

  
            <!--header에 실행되는 자바스크립트 애니 작동시키기-->                 
                <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
                <script src="script/menu_ani.js"></script>
                <script>
                    fetch('header.html')
                    .then(res => res.text())
                    .then(data => {
                    document.getElementById('header').innerHTML = data;
                    activateMenu(); // 불러온 뒤 작동시킴
                    });
                </script>

            <!--맨 위로 버튼-->
                <script>
                    const topBtn = document.getElementById("topBtn");

                    window.onscroll = function() {
                        if (document.documentElement.scrollTop > 200) {
                        topBtn.style.display = "block";
                        } else {
                        topBtn.style.display = "none";
                        }
                    };

                    topBtn.onclick = function() {
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    };
                </script>
            
            
    </body>
</html>
