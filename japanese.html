<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>라쿠텐 번역</title>
        <link rel="stylesheet" href="css/style_japanese.css">
        <link rel="stylesheet" href="css/style_header.css">


        
    </head>

    <!--파비콘-->
    <link rel="icon" href="favicon.png" type="image/png">
    
    <body>
        <div id="wrap">
            <!--헤더 고정-->
           <div id="header">
                <script>
                    fetch('header.html')
                    .then(res => res.text())
                    .then(data => {
                    document.getElementById('header').innerHTML = data;
                    });
                </script>
            </div>

            <!--맨 위로 버튼-->
            <button id="topBtn" title="맨 위로">
            TOP
            </button>


            <article id="slider">
                <div class="image-box">
                    <div class="image-box1">
                        <p>│ 일본어 상세페이지 번역</p>
                    </div>  
                       <br>
                    <div class="image-box2">
                        <p>라쿠텐 번역_고쿠고쿠 말차</p>
                    </div> 
                        <br>
                        <div class="image-box image-row">
                            <img src="images/matcha_01.jpg" alt="1">
                            <img src="images/matcha_01_1.jpg" alt="1-1">
                        </div>

                        <div class="image-box image-row">
                            <img src="images/matcha_02.jpg" alt="2">
                            <img src="images/matcha_02_1.jpg" alt="2-1">
                        </div>

                       <br>
                       <br>
                       <br>
                    <div class="image-box2">
                        <p>라쿠텐 번역_카린토</p>
                    </div> 
                    <br>
                        <div class="image-box image-row">
                            <img src="images/karinto_01_1.webp" alt="1">
                            <img src="images/karinto_01_2.jpg" alt="1-1">
                        </div>
                        
                        <div class="image-box image-row">
                            <img src="images/karinto_03_1.webp" alt="1">
                            <img src="images/karinto_03_2.jpg" alt="1-1">
                        </div>

                        <div class="image-box image-row">
                            <img src="images/karinto_04_1.webp" alt="2">
                            <img src="images/karinto_04_2.jpg" alt="2-1">
                        </div>
                        
                        <div class="image-box image-row">
                            <img src="images/karinto_05_1.webp" alt="1">
                            <img src="images/karinto_05_2.jpg" alt="1-1">
                        </div>

                        <div class="image-box image-row">
                            <img src="images/karinto_06_1.webp" alt="2">
                            <img src="images/karinto_06_2.jpg" alt="2-1">
                        </div>

                        <div class="image-box image-row">
                            <img src="images/karinto_07_1.webp" alt="1">
                            <img src="images/karinto_07_2.jpg" alt="1-1">
                        </div>

                        <div class="image-box image-row">
                            <img src="images/karinto_08_1.webp" alt="2">
                            <img src="images/karinto_08_2.jpg" alt="2-1">
                        </div>
                        </div>
            </article>



   
        </div>

  
            <!--header에 실행되는 자바스크립트 애니 작동시키기-->                 
                <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
                <script src="script/menu_ani.js"></script>
                <script>
                    fetch('header.html')
                    .then(res => res.text())
                    .then(data => {
                    document.getElementById('header').innerHTML = data;
                    activateMenu(); // 불러온 뒤 작동시킴
                    });
                </script>

            <!--맨 위로 버튼-->
                <script>
                    const topBtn = document.getElementById("topBtn");

                    window.onscroll = function() {
                        if (document.documentElement.scrollTop > 200) {
                        topBtn.style.display = "block";
                        } else {
                        topBtn.style.display = "none";
                        }
                    };

                    topBtn.onclick = function() {
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    };
                </script>

            
            
    </body>
</html>
