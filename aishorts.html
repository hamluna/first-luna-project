            <style>
            html { scroll-behavior: smooth; }

            /* 스크롤해도 고정 */
            .floating-icons{
                position: fixed;      /* 핵심 */
                right: 20px;          /* 화면 오른쪽에서 24px */
                bottom: 130px;         /* 화면 아래에서 24px (원하면 top:50%로 바꿔 세로 중앙) */
                display: grid;
                gap: 12px;
                z-index: 9999;
            }

            .fi-btn{

            }

            @media (max-width: 768px){
                .floating-icons{ right: 12px; bottom: 12px; }
                .fi-btn{ width: 40px; height: 40px; }
            }
            </style>
  
            <!--header에 실행되는 자바스크립트 애니 작동시키기-->                 
                <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
                <script src="script/menu_ani.js"></script>
                <script>
                    fetch('header.html')
                    .then(res => res.text())
                    .then(data => {
                    document.getElementById('header').innerHTML = data;
                    activateMenu(); // 불러온 뒤 작동시킴
                    });
                </script>


            <!--맨 위로 버튼-->
                <script>
                    const topBtn = document.getElementById("topBtn");

                    window.onscroll = function() {
                        if (document.documentElement.scrollTop > 200) {
                        topBtn.style.display = "block";
                        } else {
                        topBtn.style.display = "none";
                        }
                    };

                    topBtn.onclick = function() {
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    };
                </script>
