<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>상세페이지</title>
        <link rel="stylesheet" href="css/style_pages.css">
        <link rel="stylesheet" href="css/style_header.css">

  

        
    </head>

    <!--파비콘-->
    <link rel="icon" href="favicon.png" type="image/png">
          
    <body>
        <div id="wrap">
            <!--헤더 고정-->
           <div id="header">
                <script>
                    fetch('header.html')
                    .then(res => res.text())
                    .then(data => {
                    document.getElementById('header').innerHTML = data;
                    });
                </script>
            </div>

            <!--맨 위로 버튼-->
            <button id="topBtn" title="맨 위로">
            TOP
            </button>


            <article id="slider">

                
                <div class="image-box">
                    <div class="image-box1">
                        <p>│ 상세페이지 : 건강제품</p>
                    </div>
                        <br>
                    <div class="image-box2">
                        <p>두피 세럼</p>
                    </div>                    
                        <br>
                        <img src="images/pages_scalpserum.jpg" alt="3">
                        <br>
                    <div class="image-box1">
                        <p>│ 상세페이지 : 건강식품</p>
                    </div>
                        <br>
                    <div class="image-box2">
                        <p>초록입 홍합</p>
                    </div>      
                        <br>
                        <img src="images/pages_hiwellgreen.jpg" alt="1">
                        <br>  
                    <div class="image-box2">
                        <p>마누카 꿀</p>
                    </div> 
                        <br>
                        <img src="images/pages_manuka.jpg" alt="2">
                        <br> 

                    

                </div>
                
        

                
            </article>




   
        </div>

  
            <!--header에 실행되는 자바스크립트 애니 작동시키기-->                 
                <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
                <script src="script/menu_ani.js"></script>
                <script>
                    fetch('header.html')
                    .then(res => res.text())
                    .then(data => {
                    document.getElementById('header').innerHTML = data;
                    activateMenu(); // 불러온 뒤 작동시킴
                    });
                </script>

            <!--맨 위로 버튼-->
                <script>
                    const topBtn = document.getElementById("topBtn");

                    window.onscroll = function() {
                        if (document.documentElement.scrollTop > 200) {
                        topBtn.style.display = "block";
                        } else {
                        topBtn.style.display = "none";
                        }
                    };

                    topBtn.onclick = function() {
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    };
                </script>
            
            
    </body>
</html>
