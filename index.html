<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>방문 감사합니다.</title>
        <link rel="stylesheet" href="css/style_index.css">
        <link rel="stylesheet" href="css/style_header.css">

        <script src="script/jquery-1.12.3.js"></script>
        <script src="script/menu_ani.js"></script>
  


    </head>

    <!--파비콘-->
    <link rel="icon" href="favicon.png" type="image/png">
    
    <body>
        <header>
            <div id="header">
                <!--헤더고정-->
                <!--header에 실행되는 자바스크립트 애니 작동시키기-->                 
               
                <script src="script/menu_ani.js"></script>
                <script>
                    fetch('header.html')
                    .then(res => res.text())
                    .then(data => {
                    document.getElementById('header').innerHTML = data;
                    activateMenu(); // 불러온 뒤 작동시킴
                    });
                </script>
                

            </div>
        </header>

        <div id="slide">
            <div class="slide-img">
                <video src="videos/main05.mp4" video muted autoplay loop>
            </div>
            <div class="slide-text">
                <p>안녕하세요. 방문해 주셔서 감사합니다.<br>
                이곳은 PC환경에 맞춰 제작된 사이트 입니다. <br>
                편히 둘러봐 주세요.<br>
                <br>
                _최근업데이트 : 2026년 02월<br>
            </div>
        </div>

<!-- 동동 뜨는 링크 아이콘 2개 -->
            <div class="floating-icons">
            <!--<a href="#" class="fi-btn" aria-label="유튜브" target="_blank" rel="noopener noreferrer"><img src="images/youtube.png" title="유튜브"></a>-->
            <a href="https://www.crowdpic.net/@luna" class="fi-btn" aria-label="스톡이미지" target="_blank" rel="noopener noreferrer"><img src="images/stockimage.png" title="스톡이미지"></a>
            
            </div>

            <style>
            html { scroll-behavior: smooth; }

            /* 스크롤해도 고정 */
            .floating-icons{
                position: fixed;      /* 핵심 */
                right: 20px;          /* 화면 오른쪽에서 24px */
                bottom: 130px;         /* 화면 아래에서 24px (원하면 top:50%로 바꿔 세로 중앙) */
                display: grid;
                gap: 12px;
                z-index: 9999;
            }



            @media (max-width: 768px){
                .floating-icons{ right: 12px; bottom: 12px; }
                .fi-btn{ width: 40px; height: 40px; }
            }
            </style>




    </body>
</html>
