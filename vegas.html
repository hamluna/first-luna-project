<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>베가스 프로</title>
        <link rel="stylesheet" href="css/style_vegas.css">
        <link rel="stylesheet" href="css/style_header.css">

  

        
    </head>
    
    <!--파비콘-->
    <link rel="icon" href="favicon.png" type="image/png">
    
        
    <body>
        <div id="wrap">
            <!--헤더 고정-->
           <div id="header">
                <script>
                    fetch('header.html')
                    .then(res => res.text())
                    .then(data => {
                    document.getElementById('header').innerHTML = data;
                    });
                </script>
            </div>


            <!--맨 위로 버튼-->
            <button id="topBtn" title="맨 위로">
            TOP
            </button>


            <article id="slider">

                
            <div class="image-box">
                <div class="image-box1">
                    <p>│ 베가스 프로 : 더블클릭하시면 전체 화면으로 감상하실 수 있습니다.</p>
                </div>
                
                        <br>
                        <video src="videos/cheese_01.mp4" width="800px" controls alt="1"></video>
                        <br>
                        <br>
                        <video src="videos/cheese_02.mp4" width="800px" controls alt="2"></video>
                        <br>
                        <br>
                       <!-- <video src="videos/cheese_03.mp4" width="600px" controls alt="3"></video>
                        <br>-->
                        
                <br>


            </div>
                
        

                
            </article>




   
        </div>

  
            <!--header에 실행되는 자바스크립트 애니 작동시키기-->                 
                <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>
                <script src="script/menu_ani.js"></script>
                <script>
                    fetch('header.html')
                    .then(res => res.text())
                    .then(data => {
                    document.getElementById('header').innerHTML = data;
                    activateMenu(); // 불러온 뒤 작동시킴
                    });
                </script>


            <!--맨 위로 버튼-->
                <script>
                    const topBtn = document.getElementById("topBtn");

                    window.onscroll = function() {
                        if (document.documentElement.scrollTop > 200) {
                        topBtn.style.display = "block";
                        } else {
                        topBtn.style.display = "none";
                        }
                    };

                    topBtn.onclick = function() {
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    };
                </script>
            
            
    </body>
</html>
